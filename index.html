<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="FocusList is a lightweight task-management application."
    >
    <title>FocusList Task Tracker</title>
</head>

<body>
    <main class="app-container">
        <header class="app-header">
            <p class="eyebrow">Task Management Application</p>
            <h1>FocusList</h1>
            <p class="intro">
                Plan your work, track your progress, and stay focused.
            </p>
        </header>

        <section class="task-panel">
            <h2>Add a task</h2>

            <form id="task-form">
                <label for="task-input">Task description</label>

                <div class="form-row">
                    <input
                        id="task-input"
                        name="task"
                        type="text"
                        maxlength="120"
                        placeholder="What needs to be done?"
                        required
                    >

                    <button type="submit">Add task</button>
                </div>
            </form>
        </section>

        <section class="task-panel">
            <div class="toolbar">
                <h2>Your tasks</h2>

                <div class="filters" aria-label="Filter tasks">
                    <button type="button" class="filter-button active" data-filter="all">
                        All
                    </button>

                    <button type="button" class="filter-button" data-filter="active">
                        Active
                    </button>

                    <button type="button" class="filter-button" data-filter="completed">
                        Completed
                    </button>
                </div>
            </div>

            <ul id="task-list" class="task-list"></ul>

            <div id="empty-state" class="empty-state">
                <p>No tasks yet. Add your first task above.</p>
            </div>

            <footer class="task-footer">
                <p><strong id="remaining-count">0</strong> tasks remaining</p>
                <button id="clear-completed" type="button">
                    Clear completed
                </button>
            </footer>
        </section>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
